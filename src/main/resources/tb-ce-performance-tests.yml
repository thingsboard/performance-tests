spring.main.web-application-type: NONE
server:
  # Server bind address
  address: "0.0.0.0"
  # Server bind port
  port: "${SERVER_PORT:19090}"

management:
  endpoints:
    web:
      exposure:
        include: "${ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}"
  endpoint:
    shutdown:
      enabled: "${ENDPOINT_SHUTDOWN_ENABLED:true}"
endpoints:
  shutdown:
    enabled: "${ENDPOINTS_SHUTDOWN_ENABLED:true}"

rest:
  connect_server: "${REST_CONNECT_SERVER:true}"
  # Http or https. Port can be omitted. Use the same web link as you usually login with your browser
  url: "${REST_URL:http://localhost:8080}"
  username: "${REST_USERNAME:tenant@thingsboard.org}"
  password: "${REST_PASSWORD:tenant}"
  pool_size: "${REST_POOL_SIZE:4}"
mqtt:
  # For MQTT use hostname or IP. For MQTTS use only hostname
  host: "${MQTT_HOST:localhost}"
  # Usually 1883 for MQTT or 8883 for MQTTS
  port: "${MQTT_PORT:1883}"
  keepAliveSec: "${MQTT_KEEPALIVE_SEC:0}" # MQTT keep-alive interval (s); set a positive value to override, 0 = client-library default (60). Lower = more frequent PINGREQ
  reconnectMinDelaySec: "${MQTT_RECONNECT_MIN_DELAY_SEC:0}" # per-client reconnect delay lower bound (s). min==max (or max=0) => constant; max>min => random jitter per client; both 0 => library default (1s)
  reconnectMaxDelaySec: "${MQTT_RECONNECT_MAX_DELAY_SEC:0}" # per-client reconnect delay upper bound (s). See reconnectMinDelaySec
  ssl:
    enabled: "${MQTT_SSL_ENABLED:false}"
    # Java keystore file mqttclient.jks. If not set, it will use a default trusted certs for Java like ca-certificates pre-installed. Use custom JKS truststore only to deal with self-managed certificates
    key_store: "${MQTT_SSL_KEY_STORE:}"
    key_store_password: "${MQTT_SSL_KEY_STORE_PASSWORD:password}"
lwm2m:
  recommended_ciphers: "${LWM2M_RECOMMENDED_CIPHERS:false}"
  recommended_supported_groups: "${LWM2M_RECOMMENDED_SUPPORTED_GROUPS:false}"
  prefix_end_point: "${PREFIX_END_POINT:Lw}"
  noSec:
    enabled: "${NO_SEC_ENABLED:true}"
    server:
      host: "${NO_SEC_HOST:localhost}"
      port: "${NO_SEC_PORT:5685}"
    bootStrap:
      enabled: "${NO_SEC_BS_ENABLED:true}"
      host: "${NO_SEC_BS_HOST:localhost}"
      port: "${NO_SEC_BS_PORT:5687}"
  psk:
    enabled: "${PSK_ENABLED:true}"
    identity_sub: "${PSK_IDENTITY_SUB:_identity}"
    server:
      host: "${PSK_HOST:localhost}"
      port: "${PSK_PORT:5686}"
    bootStrap:
      enabled: "${PSK_BS_ENABLED:true}"
      host: "${PSK_BS_HOST:localhost}"
      port: "${PSK_BS_PORT:5688}"
  rpk:
    enabled: "${RPK_ENABLED:true}"
    server:
      host: "${RPK_HOST:localhost}"
      port: "${RPK_PORT:5686}"
    bootStrap:
      enabled: "${RPK_BS_ENABLED:true}"
      host: "${RPK_BS_HOST:localhost}"
      port: "${RPK_BS_PORT:5688}"
  x509:
    enabled: "${X509_ENABLED:true}"
    trust: "${X509_ENABLED_TRUST:true}"
    create:
      enabled: "${CREATE_NEW_KEY_STORE_JAVA:false}"
      # Files jks
      key_store_server_file: "${KEY_STORE_SERVER_FILE:lwm2mserver.jks}"
      key_store_client_file: "${KEY_STORE_CLIENT_FILE:lwm2mclient.jks}"
      key_store_client_no_trust_file: "${KEY_STORE_CLIENT_NO_TRUST_FILE:lwm2mclientnotrust.jks}"
      # Alias
      root_alias: "${ROOT_ALIAS:rootCA}"
      server_alias: "${SERVER_ALIAS:server}"
      bootstrap_alias: "${BOOTSTRAP_ALIAS:bootstrap}"
      client_alias_no_trust: "${CLIENT_ALIAS_NO_TRUST:client_not_trusted}"
      client_alias_private_key_no_trust: "${CLIENT_ALIAS_PRIVATE_KEY_NO_TRUST:client}"
      prefix_client_alias: "${CLIENT_ALIAS:client_alias_}"
      # CN
      root_endpoint: "${ROOT_CN:root.com}"
      server_endpoint: "${SERVER_CN:localhost}"
      bootstrap_endpoint: "${BOOTSTRAP_CN:bootstrap.bootstrap}"
      pref_sub_endpoint: "${PREF_SUB_CN:sub}"
#      start to 0
      sub_level: "${SUB_LEVEL:2}"
      client_no_trust_endpoint: "${CLIENT_NO_TRUST_ENDPOINT:deviceAEndpoint}"
      # PSW
      server_key_store_pwd: "${SERVER_KEY_STORE_PWD:server_ks_password}"
#      server_key_store_pwd: "${SERVER_KEY_STORE_PWD:server}"
      client_key_store_pwd: "${CLIENT_KEY_STORE_PWD:client_ks_password}"
      client_no_trust_key_store_pwd: "${CLIENT_NO_TRUST_KEY_STORE_PWD:client_ks_password}"
    create_new_key_store_sh: "${CREATE_NEW_KEY_STORE_SH:false}"
    server:
      host: "${X509_HOST:localhost}"
      port: "${X509_PORT:5686}"
    bootStrap:
      enabled: "${X509_BS_ENABLED:true}"
      host: "${X509_BS_HOST:localhost}"
      port: "${X509_BS_PORT:5688}"
  client:
    host: "${CLIENT_HOST:0.0.0.0}"
    startPort: "${START_PORT:10000}"
    # The communication period in seconds which should be smaller than the lifetime, will be used even if bootstrap_enable==true.
    communication_period: "${COMMUNICATION_PERIOD:}"
    # requestTimeoutInMs = 2 * 60 * 1000l; // 2min in ms
    # request_timeout: "${REQUEST_TIMEOUT:1000}"
    request_timeout: "${REQUEST_TIMEOUT:}"
device:
  # Device API to use - MQTT, HTTP or LWM2M
  api: "${DEVICE_API:MQTT}"
  startIdx: "${DEVICE_START_IDX:0}"
  endIdx: "${DEVICE_END_IDX:1000}"
  count: "${DEVICE_COUNT:1000}" # count of devices to be used by clients in k8s deployment run
  createOnStart: "${DEVICE_CREATE_ON_START:true}"
  deleteOnComplete: "${DEVICE_DELETE_ON_COMPLETE:false}"
  nameFormat: "${DEVICE_NAME_FORMAT:DEFAULT}" # DEFAULT (DW%08d) or UUID (deterministic 36-char). Device names only; gateways always GW%08d
  profile: "${DEVICE_PROFILE:}" # device profile name to assign/create; empty = use test.payloadType
deviceProfile:
  path: "${DEVICE_PROFILE_PATH:}" # filesystem dir of profile JSON files; empty = load from classpath device/profile/
stats:
  log:
    enabled: "${STATS_LOG_ENABLED:true}"        # master on/off for all stats logging (every mode)
    intervalSec: "${STATS_LOG_INTERVAL_SEC:10}" # single interval for every stat block; <=0 also disables
gateway:
  namePrefix: "${GATEWAY_NAME_PREFIX:}" # per-tenant prefix prepended to gateway names/tokens; empty = legacy GW%08d. Use a distinct value per tenant to avoid globally-unique-token collisions; devices are never prefixed
  startIdx: "${GATEWAY_START_IDX:0}"
  endIdx: "${GATEWAY_END_IDX:10}"
  count: "${GATEWAY_COUNT:3}" # count of devices to be used by clients in k8s deployment run
  createOnStart: "${GATEWAY_CREATE_ON_START:false}"
  deleteOnComplete: "${GATEWAY_DELETE_ON_COMPLETE:false}"
  profile: "${GATEWAY_PROFILE:}" # device profile name to assign to gateways; empty = same profile as devices
  overwriteActivityTime: "${GATEWAY_OVERWRITE_ACTIVITY_TIME:false}" # true = set additionalInfo.overwriteActivityTime on gateways so the gateway's connection activity keeps sub-devices Active without their own telemetry; reconciled (created + existing) on every run
  batch: "${GATEWAY_BATCH:false}" # true = one publish per gateway carrying all its devices; MESSAGES_PER_SECOND then counts gateway publishes
  ephemeral:
    enabled: "${EPHEMERAL_ENABLED:false}" # true = connect->publish batch->disconnect per cycle (requires gateway.batch=true)
    cycleLengthSec: "${EPHEMERAL_CYCLE_SEC:900}" # per-gateway cadence
    jitterSec: "${EPHEMERAL_JITTER_SEC:300}" # one-sided [0,jitter] added to each cycle
    firstConnectJitterSec: "${EPHEMERAL_FIRST_CONNECT_JITTER_SEC:-1}" # first connect spread over [0,this) seconds; -1 (unset) = inherit jitterSec; 0 = all connect at t=0
    maxConcurrentConnects: "${EPHEMERAL_MAX_CONCURRENT_CONNECTS:auto}" # 'auto' = ceil(rate*CONNECT_TIMEOUT*2); positive int overrides
    gatewayConnect: "${EPHEMERAL_GATEWAY_CONNECT:false}" # true = also publish v1/gateway/connect per cycle (default: telemetry-only)
    schedulerThreads: "${EPHEMERAL_SCHEDULER_THREADS:2}" # dedicated timing pool size
    maxRetries: "${EPHEMERAL_MAX_RETRIES:3}" # bounded app-level retries after a failed ephemeral cycle; each retry a fresh throwaway client (library reconnect stays off); 0 = pre-feature single-attempt behaviour
    retryBackoffMinMs: "${EPHEMERAL_RETRY_BACKOFF_MIN_MS:1000}" # lower bound (ms) of the jittered exponential retry backoff
    retryBackoffMaxMs: "${EPHEMERAL_RETRY_BACKOFF_MAX_MS:5000}" # upper bound (ms) / cap of the retry backoff window (full-jitter over min<<attempt, capped here)
    retryDeadlineMs: "${EPHEMERAL_RETRY_DEADLINE_MS:0}" # optional hard cap (ms) on total time a cycle may spend retrying; 0 = bounded only by maxRetries
    permitWaitMs: "${EPHEMERAL_PERMIT_WAIT_MS:250}" # when all connect permits are in use, re-queue the cycle after a jittered [1,this]ms wait instead of blocking a scheduler thread (blocking would deadlock the pool under a failure burst)
  rpc:
    enabled: "${GATEWAY_RPC_ENABLED:false}" # true = persistent gateways subscribe to v1/gateway/rpc, handle inbound RPC, respond, and measure one-way delivery latency (use MESSAGES_PER_SECOND=0 for pure RPC). Not supported with ephemeral mode.
    topic: "${GATEWAY_RPC_TOPIC:v1/gateway/rpc}" # gateway RPC subscription + response topic
    respond: "${GATEWAY_RPC_RESPOND:true}" # publish a response to close two-way RPC; set false only if the chain uses one-way RPC
    responseDelayMs: "${GATEWAY_RPC_RESPONSE_DELAY_MS:0}" # delay (ms) before publishing the device reply. 0 = reply immediately; >0 exercises the delayed-response case
    responseTemplate: "${GATEWAY_RPC_RESPONSE_TEMPLATE:}" # filesystem path to a response template JSON; empty = built-in neutral ACCEPTED template
    sendTsPath: "${GATEWAY_RPC_SEND_TS_PATH:data.params.sendTs}" # dot-path to the send-timestamp (epoch ms) the rule chain stamps into the RPC payload
    drain:
      quietSec: "${GATEWAY_RPC_DRAIN_QUIET_SEC:5}" # inbound RPC must be idle this long before the tail is called settled (drain exits early)
      maxSec: "${GATEWAY_RPC_DRAIN_MAX_SEC:0}" # hard cap on the post-window drain. >0 = explicit seconds; 0 = auto (sender on: timeoutMs+responseDelayMs+5s; sender off: 30s), floored to >= quietSec
    replyRetryEnabled: "${GATEWAY_RPC_REPLY_RETRY_ENABLED:true}" # true = buffer a gateway RPC reply whose publish failed (channel dropped mid-reply) and re-publish it when that client reconnects; false = legacy immediate 'lost'
    replyRetryMaxBuffered: "${GATEWAY_RPC_REPLY_RETRY_MAX_BUFFERED:64}" # per-client cap on buffered replies awaiting reconnect (steady buffer ~= sub-devices per gateway); overflow is dropped and counted lost. Reply expiry = GATEWAY_RPC_EXPIRY_MS
    expiryMs: "${GATEWAY_RPC_EXPIRY_MS:120000}" # server-side RPC expiry (ms): the reply-retry TTL, and the deadline the re-announce/resubscribe retry cap is sized to fit under
    ack: # reliability of the device-announce PUBACK on (re)connect (resubscribe is observe-only, not retried)
      timeoutMs: "${GATEWAY_RPC_ACK_TIMEOUT_MS:5000}" # per-attempt wait for the announce PUBACK before retry (also bounds a channel-null publish whose future never completes); also the reply orphan-capture deadline. Not used by subscribe
      maxAttempts: "${GATEWAY_RPC_ACK_MAX_ATTEMPTS:5}" # bounded retries until broker-confirmed; exhausted => unconfirmed (device/subscription at risk of losing RPC)
      backoffMinMs: "${GATEWAY_RPC_ACK_BACKOFF_MIN_MS:1000}" # jittered-exponential retry backoff floor
      backoffMaxMs: "${GATEWAY_RPC_ACK_BACKOFF_MAX_MS:5000}" # ...and cap (sized so maxAttempts*(timeout+backoffMax) < expiryMs)
    announce:
      maxConcurrent: "${GATEWAY_RPC_ANNOUNCE_MAX_CONCURRENT:1000}" # global in-flight cap on device announces so a reconnect storm can't self-amplify
      permitWaitMs: "${GATEWAY_RPC_ANNOUNCE_PERMIT_WAIT_MS:250}" # non-blocking re-queue wait when the cap is saturated (never blocks the event loop)
    sender:
      enabled: "${GATEWAY_RPC_SENDER_ENABLED:false}" # true = this instance fires boundary-aligned rule-engine RPC bursts for its device range (requires gateway.rpc.enabled; use MESSAGES_PER_SECOND=0)
      template: "${GATEWAY_RPC_SENDER_TEMPLATE:}" # filesystem path to a {method, params} JSON command body; empty = built-in neutral default
      intervalSec: "${GATEWAY_RPC_SENDER_INTERVAL_SEC:60}" # how often to fire a burst (s). Bursts fire on round clock times (multiples of this, e.g. every whole minute), so separate instances with accurate clocks fire at the same moment without coordinating
      startDelaySec: "${GATEWAY_RPC_SENDER_START_DELAY_SEC:0}" # 0 = auto (next boundary after warmup); >0 = extra settling margin
      chunkSize: "${GATEWAY_RPC_SENDER_CHUNK_SIZE:500}" # devices per rule-engine REST call (TBEL result-size bound)
      queue: "${GATEWAY_RPC_SENDER_QUEUE:RpcCalls}" # rule-engine queue name in the URL
      timeoutMs: "${GATEWAY_RPC_SENDER_TIMEOUT_MS:10000}" # rule-engine call timeout; MUST equal the rule chain's hardcoded TIMEOUT_MS

customer:
  startIdx: "${CUSTOMER_START_IDX:0}"
  endIdx: "${CUSTOMER_END_IDX:0}"
  createOnStart: "${CUSTOMER_CREATE_ON_START:true}"
  deleteOnComplete: "${CUSTOMER_DELETE_ON_COMPLETE:false}"
dashboard:
  createOnStart: "${DASHBOARD_CREATE_ON_START:true}"
  deleteOnComplete: "${DASHBOARD_DELETE_ON_COMPLETE:false}"
  deleteIfExists: "${DASHBOARD_DELETE_IF_EXISTS:false}"
  tenant: alarms.json # please use comma separated list for multiple dashboards: dashboard1.json, dashboard2.json
  shared: "devices.json"
warmup:
  enabled: "${WARMUP_ENABLED:true}"
  packSize: "${WARMUP_PACK_SIZE:100}"
test:
  # Type of the payload to send: DEFAULT, SMART_TRACKER, SMART_METER
  # RANDOM - TODO: add description
  # SMART_TRACKER - sample payload: {"latitude": 42.222222, "longitude": 73.333333, "speed": 55.5, "fuel": 92, "batteryLevel": 81}
  # SMART_METER - sample payload: {"pulseCounter": 1234567, "leakage": false, "batteryLevel": 81}
  # INDUSTRIAL_PLC - sample payload (60 lines by default) {"line001": 1.0023, "line002": 95.440321}
  payloadType: "${TEST_PAYLOAD_TYPE:SMART_METER}" # device profile name
  payloadDatapoints: "${TEST_PAYLOAD_DATAPOINTS:60}" # datapoints per single message (used for INDUSTRIAL_PLC)
  payloadTemplate: "${TEST_PAYLOAD_TEMPLATE:}" # filesystem path to a payload template JSON; required when payloadType=CUSTOM
  instanceIdx: "${INSTANCE_IDX:0}"
  useInstanceIdx: "${USE_INSTANCE_IDX:false}"
  useInstanceIdxRegex: "${USE_INSTANCE_IDX_REGEX:false}"
  instanceIdxRegexSource: "${INSTANCE_IDX_REGEX_SOURCE:}"
  instanceIdxRegex: "${INSTANCE_IDX_REGEX:([0-9]+)$}"
  enabled: "${TEST_ENABLED:true}"
  updateRootRuleChain: "${UPDATE_ROOT_RULE_CHAIN:false}"
  revertRootRuleChain: "${REVERT_ROOT_RULE_CHAIN:false}"
  # Test API to use - device, gateway or lwm2m
  # If Device API == LWM2M only - lwm2m
  api: "${TEST_API:device}"
  sequential: "${TEST_SEQUENTIAL:false}"
  ruleChainName:  "${RULE_CHAIN_NAME:root_rule_chain_ce.json}"
  # messages per second.
  telemetry: "${TEST_TELEMETRY:true}"
  mps: "${MESSAGES_PER_SECOND:1000}"
  duration: "${DURATION_IN_SECONDS:300}"
  alarms:
    start: "${ALARM_STORM_START_SECOND:0}"
    end: "${ALARM_STORM_END_SECOND:999999}"
    # alarms per second should be less them messages per second.
    aps: "${ALARMS_PER_SECOND:1}"
  exitAfterComplete: "${EXIT_AFTER_COMPLETE:true}" # this useful for kubernetes statefulset setup
  seed: "${SEED:0}" # random seed to provide reproducible random order on each run
